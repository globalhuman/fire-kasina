<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Kasina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            user-select: none;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 0;
        }

        /* ── FLAME PICKER ── */
        #flame-picker {
            display: flex;
            gap: 6px;
            padding: 14px 0 4px;
            z-index: 2;
        }

        .fpick {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: 1px solid rgba(255,80,0,0.18);
            color: rgba(255,140,40,0.45);
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 6px 10px 7px;
            cursor: pointer;
            border-radius: 1px;
            transition: all 0.22s;
            line-height: 1;
        }

        .fpick svg { pointer-events: none; }

        .fpick:hover {
            border-color: rgba(255,120,0,0.55);
            color: rgba(255,190,70,0.8);
            background: rgba(255,60,0,0.05);
        }

        .fpick.active {
            border-color: rgba(255,140,0,0.65);
            color: rgba(255,210,70,0.9);
            background: rgba(255,80,0,0.1);
        }

        /* ── FLAME ── */
        #flame-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        #flame-halo {
            position: absolute;
            width: 300px;
            height: 380px;
            background: radial-gradient(ellipse at 50% 60%,
                rgba(220,60,0,0.16) 0%,
                rgba(180,30,0,0.07) 45%,
                transparent 72%);
            animation: halo-pulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes halo-pulse {
            0%,100% { transform: scale(1);    opacity: 0.8; }
            50%      { transform: scale(1.07); opacity: 1;   }
        }

        #flame-svg {
            width:  min(46vh, 230px);
            height: min(66vh, 330px);
            animation: breathe 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
            transition: opacity 0.35s;
        }

        #flame-svg.switching { opacity: 0; }

        @keyframes breathe {
            0%,100% { transform: scale(1);     filter: drop-shadow(0 0 26px #FF4400cc) drop-shadow(0 0 65px #FF220066); }
            50%      { transform: scale(1.028); filter: drop-shadow(0 0 40px #FF6600dd) drop-shadow(0 0 88px #FF330088); }
        }

        /* ── CONTROLS ── */
        #controls {
            padding-bottom: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;
        }

        #timer-display {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.9rem, 5vw, 2.7rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            color: rgba(255,130,40,0.5);
            min-width: 90px;
            text-align: center;
            transition: color 0.6s;
        }

        #timer-display.running { color: rgba(255,180,60,0.9); }
        #timer-display.ending  { color: rgba(255,230,100,1);  }

        .dur-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

        button {
            background: none;
            border: 1px solid rgba(255,90,0,0.25);
            color: rgba(255,150,50,0.55);
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 7px 14px;
            cursor: pointer;
            border-radius: 1px;
            transition: all 0.2s;
        }

        button:hover {
            border-color: rgba(255,120,0,0.7);
            color: rgba(255,200,80,0.95);
            background: rgba(255,70,0,0.07);
        }

        button.active {
            border-color: rgba(255,140,0,0.6);
            color: rgba(255,210,70,0.88);
            background: rgba(255,80,0,0.09);
        }

        #start-btn {
            padding: 10px 34px;
            font-size: 0.74rem;
            border-color: rgba(255,110,0,0.48);
            color: rgba(255,200,70,0.85);
        }

        #start-btn:hover { background: rgba(255,90,0,0.12); border-color: rgba(255,150,0,0.9); }
        #reset-btn { display: none; }

        /* Custom time input */
        #custom-row {
            display: none;
            align-items: center;
            gap: 8px;
        }

        #custom-row.show { display: flex; }

        #custom-input {
            background: none;
            border: 1px solid rgba(255,110,0,0.35);
            color: rgba(255,200,70,0.9);
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            padding: 6px 12px;
            width: 110px;
            text-align: center;
            border-radius: 1px;
            outline: none;
            caret-color: rgba(255,200,70,0.8);
        }

        #custom-input::placeholder { color: rgba(255,150,50,0.35); font-style: italic; }
        #custom-input:focus { border-color: rgba(255,150,0,0.7); }

        #custom-set {
            padding: 6px 14px;
            font-size: 0.62rem;
        }

        #instruction {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: clamp(0.72rem, 1.7vw, 0.86rem);
            font-weight: 300;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.16);
            text-align: center;
            max-width: 340px;
            line-height: 1.8;
        }

        /* ── END OVERLAY ── */
        #end-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #end-overlay.show { opacity: 1; pointer-events: all; }

        #end-main {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.3rem, 3.5vw, 1.9rem);
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255,210,80,0);
            text-align: center;
            transition: color 1.4s ease-out;
        }

        #end-main.show { color: rgba(255,210,80,0.88); }

        #end-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(0.9rem, 2.2vw, 1.1rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0);
            text-align: center;
            max-width: 380px;
            line-height: 1.9;
            transition: color 1.8s ease-out;
        }

        #end-sub.show { color: rgba(255,255,255,0.36); }

        #end-again {
            margin-top: 30px;
            opacity: 0;
            transition: opacity 1.2s;
            border-color: rgba(255,110,0,0.4);
            color: rgba(255,190,60,0.7);
            padding: 10px 30px;
        }

        #end-again.show { opacity: 1; }
    </style>
</head>
<body>
<div id="app">

                <path d="M100,235C72,200,55,165,70,112C80,78,90,55,100,38C110,55,120,78,130,112C145,165,128,200,100,235Z" fill="#FFCC00"/>
            </svg>
            Bonfire
        </button>
        <button class="fpick" data-flame="4">
            <svg width="32" height="44" viewBox="0 0 200 290">
                <ellipse cx="100" cy="155" rx="90" ry="68" fill="url(#thumbEmber)"/>
                <defs><radialGradient id="thumbEmber" cx="42%" cy="45%" r="55%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="25%" stop-color="#FFEE00"/><stop offset="55%" stop-color="#FF4400"/><stop offset="100%" stop-color="#660000" stop-opacity="0.2"/></radialGradient></defs>
                <ellipse cx="82" cy="142" rx="22" ry="16" fill="#FFFFAA" opacity="0.5"/>
            </svg>
            Ember
        </button>
    </div>

    <!-- Main flame -->
    <div id="flame-wrap">
        <div id="flame-halo"></div>
        <svg id="flame-svg" viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg">
            <!-- Populated by JS -->
        </svg>
    </div>

    <!-- Controls -->
    <div id="controls">
        <div id="timer-display">1:00</div>

        <div class="dur-row">
            <button data-dur="30">30s</button>
            <button data-dur="60" class="active">60s</button>
            <button data-dur="90">90s</button>
            <button data-dur="120">2m</button>
            <button data-dur="180">3m</button>
            <button id="custom-btn" data-dur="custom">Custom</button>
        </div>

        <div id="custom-row">
            <input id="custom-input" type="text" placeholder="e.g. 2:30 or 45" maxlength="6" autocomplete="off" spellcheck="false"/>
            <button id="custom-set">Set</button>
        </div>

        <div style="display:flex;gap:10px;">
            <button id="start-btn">Begin</button>
            <button id="reset-btn">Reset</button>
        </div>

        <p id="instruction">
            Gaze softly at the white dot. Try not to blink or look away.<br>
            When the timer ends, close your eyes immediately.
        </p>
    </div>
</div>

<!-- Pure black screen — afterimage lives here -->
<div id="end-overlay">
    <div id="end-main">Close your eyes now</div>
    <div id="end-sub">
        Observe the nimitta forming in the darkness.<br>
        Let it stabilise without grasping.
    </div>
    <button id="end-again" onclick="resetAll()">Sit Again</button>
</div>

        <stop offset="100%" stop-color="#440000" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="eMain" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFBB00"/>
        <stop offset="28%"  stop-color="#FF5500"/>
        <stop offset="60%"  stop-color="#CC0800"/>
        <stop offset="88%"  stop-color="#660000"/>
        <stop offset="100%" stop-color="#220000"/>
      </radialGradient>
      <radialGradient id="eHot1" cx="40%" cy="42%" r="55%">
        <stop offset="0%"   stop-color="#FFFFFF"/>
        <stop offset="30%"  stop-color="#FFFF88" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#FFAA00" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="eHot2" cx="65%" cy="58%" r="55%">
        <stop offset="0%"   stop-color="#FFFF66"/>
        <stop offset="40%"  stop-color="#FF8800" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#FF3300" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="eCore" cx="46%" cy="45%" r="50%">
        <stop offset="0%"   stop-color="#FFFFFF"/>
        <stop offset="50%"  stop-color="#FFFFAA" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#FFCC00" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Outer corona -->
    <ellipse cx="100" cy="148" rx="96" ry="74" fill="url(#eOuter)"/>
    <!-- Main coal body -->
    <ellipse cx="100" cy="148" rx="84" ry="64" fill="url(#eMain)"/>
    <g style="transform-origin:100px 148px;animation:flicker 2.6s ease-in-out infinite">
      <!-- Hot spot 1 -->
      <ellipse cx="82" cy="138" rx="34" ry="26" fill="url(#eHot1)"/>
      <!-- Hot spot 2 -->
      <ellipse cx="120" cy="158" rx="28" ry="21" fill="url(#eHot2)"/>
      <!-- Bright core -->
      <ellipse cx="97" cy="142" rx="20" ry="15" fill="url(#eCore)"/>
    </g>
  `},
];

// ─────────────────────────────────────────────
//  TIMER STATE
// ─────────────────────────────────────────────
let duration  = 60;
let remaining = 60;
let ticker    = null;
let running   = false;
let currentFlame = 0;

const display    = document.getElementById('timer-display');
const startBtn   = document.getElementById('start-btn');
const resetBtn   = document.getElementById('reset-btn');
const endOverlay = document.getElementById('end-overlay');
const endMain    = document.getElementById('end-main');
const endSub     = document.getElementById('end-sub');
const endAgain   = document.getElementById('end-again');
const flameSvg   = document.getElementById('flame-svg');
const customRow  = document.getElementById('custom-row');
const customInput = document.getElementById('custom-input');
const customSet  = document.getElementById('custom-set');

// Global flicker keyframe (applied to g elements inside each flame)
const style = document.createElement('style');
style.textContent = `
  @keyframes flicker {
    0%,100% { transform:scale(1)     skewX(0deg);    opacity:1;    }
    20%      { transform:scale(1.012) skewX(0.6deg);  opacity:0.97; }
    45%      { transform:scale(0.993) skewX(-0.4deg); opacity:1;    }
    70%      { transform:scale(1.008) skewX(0.3deg);  opacity:0.96; }
  }
`;
document.head.appendChild(style);

// ─────────────────────────────────────────────
//  FLAME SWITCHING
// ─────────────────────────────────────────────
function loadFlame(idx) {
    const f = FLAMES[idx];
    flameSvg.classList.add('switching');
    setTimeout(() => {
        flameSvg.setAttribute('viewBox', f.viewBox);
        flameSvg.innerHTML = f.svg +
            `<circle cx="${f.dot[0]}" cy="${f.dot[1]}" r="5.5" fill="white"
             style="filter:drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 12px rgba(255,255,255,0.5))"/>`;
        flameSvg.classList.remove('switching');
    }, 320);
}

document.querySelectorAll('.fpick').forEach(btn => {
    btn.addEventListener('click', () => {
        if (running) return;
        document.querySelectorAll('.fpick').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFlame = parseInt(btn.dataset.flame);
        loadFlame(currentFlame);
    });
});

// ─────────────────────────────────────────────
//  DURATION BUTTONS
// ─────────────────────────────────────────────
const fmt = s => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
function refresh() { display.textContent = fmt(remaining); }

document.querySelectorAll('[data-dur]').forEach(btn => {
    btn.addEventListener('click', () => {
        if (running) return;
        const val = btn.dataset.dur;

        document.querySelectorAll('[data-dur]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (val === 'custom') {
            customRow.classList.add('show');
            customInput.focus();
        } else {
            customRow.classList.remove('show');
            duration = remaining = parseInt(val);
            refresh();
        }
    });
});

// Parse custom time input: accepts "90", "1:30", "2m", "2m30s", "2:30"
function parseCustomTime(str) {
    str = str.trim().toLowerCase();
    // mm:ss
    const colonMatch = str.match(/^(\d+):(\d{1,2})$/);
    if (colonMatch) return parseInt(colonMatch[1]) * 60 + parseInt(colonMatch[2]);
    // Xm or XmYs
    const mMatch = str.match(/^(\d+)m(?:(\d+)s?)?$/);
    if (mMatch) return parseInt(mMatch[1]) * 60 + (mMatch[2] ? parseInt(mMatch[2]) : 0);
    // plain seconds
    const numMatch = str.match(/^(\d+)s?$/);
    if (numMatch) return parseInt(numMatch[1]);
    return null;
}

function applyCustomTime() {
    const secs = parseCustomTime(customInput.value);
    if (!secs || secs < 5 || secs > 3600) {
        customInput.style.borderColor = 'rgba(255,50,0,0.7)';
        setTimeout(() => customInput.style.borderColor = '', 1000);
        return;
    }
    duration = remaining = secs;
    refresh();
    customRow.classList.remove('show');
}

customSet.addEventListener('click', applyCustomTime);
customInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyCustomTime(); });

// ─────────────────────────────────────────────
//  TIMER
// ─────────────────────────────────────────────
startBtn.addEventListener('click', () => {
    if (running) return;
    running = true;
    startBtn.style.display = 'none';
    resetBtn.style.display = '';
    display.classList.add('running');

    ticker = setInterval(() => {
        remaining--;
        refresh();
        if (remaining <= 5 && remaining > 0) display.classList.add('ending');
        if (remaining <= 0) {
            clearInterval(ticker);
            ticker = null;
            running = false;
            triggerEnd();
        }
    }, 1000);
});

resetBtn.addEventListener('click', resetAll);

function triggerEnd() {
    endOverlay.classList.add('show');
    setTimeout(() => endMain.classList.add('show'), 260);
    setTimeout(() => endSub.classList.add('show'),  2500);
    setTimeout(() => endAgain.classList.add('show'), 7000);
}

function resetAll() {
    clearInterval(ticker);
    ticker = null;
    running = false;
    remaining = duration;
    refresh();

    endOverlay.classList.remove('show');
    endMain.classList.remove('show');
    endSub.classList.remove('show');
    endAgain.classList.remove('show');

    startBtn.style.display = '';
    resetBtn.style.display = 'none';
    display.classList.remove('running', 'ending');
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
loadFlame(0);
</script>
</body>
</html>
