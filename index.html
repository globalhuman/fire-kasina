<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Kasina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            color-scheme: dark;
            --page-bg: #000;
            --end-bg: #000;
            --end-fg: rgba(255, 222, 132, 0.88);
            --ember: rgba(255, 132, 30, 0.84);
            --ember-soft: rgba(255, 132, 30, 0.38);
            --ember-dim: rgba(255, 132, 30, 0.18);
            --ink: #000;
            --text-soft: rgba(255, 232, 185, 0.62);
            --hint: rgba(255, 255, 255, 0.18);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--page-bg);
            overflow: hidden;
            user-select: none;
        }

        body {
            font-family: "Cinzel", Georgia, serif;
            color: var(--text-soft);
        }

        body.cursor-hidden,
        body.cursor-hidden * {
            cursor: none !important;
        }

        html:fullscreen body.cursor-hidden,
        html:fullscreen body.cursor-hidden #app,
        html:fullscreen body.cursor-hidden #end-overlay {
            cursor: none !important;
        }

        body.cursor-hidden::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            cursor: none !important;
            pointer-events: none;
        }

        body[data-bg="black"] {
            --page-bg: #000;
            --end-bg: #000;
            --end-fg: rgba(255, 222, 132, 0.88);
            --hint: rgba(255, 255, 255, 0.2);
        }

        body[data-bg="white"] {
            --page-bg: #fff;
            --end-bg: #fff;
            --end-fg: rgba(0, 0, 0, 0.78);
            --hint: rgba(0, 0, 0, 0.44);
            --text-soft: rgba(0, 0, 0, 0.7);
        }

        body[data-bg="white"] button {
            border-color: rgba(0, 0, 0, 0.26);
            color: rgba(0, 0, 0, 0.68);
            background: rgba(0, 0, 0, 0.025);
        }

        body[data-bg="white"] button:hover,
        body[data-bg="white"] button:focus-visible,
        body[data-bg="white"] button.active {
            border-color: rgba(0, 0, 0, 0.58);
            color: rgba(0, 0, 0, 0.88);
            background: rgba(0, 0, 0, 0.07);
        }

        body[data-bg="white"] #timer-display {
            color: rgba(0, 0, 0, 0.56);
        }

        body[data-bg="white"] #timer-display.running,
        body[data-bg="white"] #timer-display.ending {
            color: rgba(0, 0, 0, 0.82);
        }

        body[data-bg="white"] #instruction {
            color: rgba(0, 0, 0, 0.34);
        }

        body[data-bg="red"] {
            --page-bg: #220000;
            --end-bg: #220000;
            --end-fg: rgba(255, 232, 188, 0.92);
            --hint: rgba(255, 244, 220, 0.28);
        }

        body[data-bg="gray"] {
            --page-bg: #111;
            --end-bg: #111;
            --end-fg: rgba(245, 245, 245, 0.82);
            --hint: rgba(255, 255, 255, 0.24);
        }

        button, input {
            font: inherit;
        }

        button {
            background: rgba(255, 82, 0, 0.035);
            border: 1px solid rgba(255, 110, 0, 0.28);
            color: rgba(255, 178, 70, 0.64);
            border-radius: 2px;
            cursor: pointer;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: background 180ms ease, border-color 180ms ease, color 180ms ease, opacity 180ms ease;
        }

        button:hover,
        button:focus-visible {
            background: rgba(255, 82, 0, 0.1);
            border-color: rgba(255, 150, 20, 0.72);
            color: rgba(255, 216, 112, 0.94);
            outline: none;
        }

        button.active {
            background: rgba(255, 94, 0, 0.14);
            border-color: rgba(255, 165, 36, 0.72);
            color: rgba(255, 226, 138, 0.96);
        }

        #app {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            height: 100vh;
            height: 100dvh;
            min-height: 520px;
            padding: 16px 18px 20px;
            gap: 12px;
        }

        #flame-picker {
            display: flex;
            justify-content: center;
            gap: 7px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
            transition: opacity 240ms ease;
        }

        .fpick {
            display: grid;
            grid-template-rows: 44px auto auto;
            place-items: center;
            min-width: 76px;
            min-height: 78px;
            padding: 6px 10px 7px;
            gap: 3px;
            font-size: 0.56rem;
            line-height: 1;
        }

        .fpick svg {
            width: 32px;
            height: 44px;
            overflow: visible;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 72, 0, 0.48));
        }

        .shortcut {
            display: block;
            margin-top: 4px;
            color: var(--hint);
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 0.72rem;
            font-style: italic;
            letter-spacing: 0.03em;
            text-transform: none;
        }

        #flame-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            margin-left: calc(50% - 50vw);
            height: 100%;
            min-height: 0;
            isolation: isolate;
            overflow: visible;
            pointer-events: none;
            z-index: 0;
        }

        #flame-halo {
            position: absolute;
            width: min(92vmin, 620px);
            height: min(108vmin, 760px);
            background: radial-gradient(ellipse at 50% 57%,
                rgba(255, 90, 0, 0.18) 0%,
                rgba(218, 42, 0, 0.1) 34%,
                rgba(170, 20, 0, 0.045) 60%,
                transparent 76%);
            animation: halo-pulse 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        #flame-svg {
            width: min(84vmin, 560px);
            height: min(88vmin, 680px);
            overflow: visible;
            position: relative;
            z-index: 1;
            animation: breathe 4s ease-in-out infinite;
            transition: opacity 260ms ease, filter 260ms ease;
        }

        #flame-svg.switching {
            opacity: 0;
        }

        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 11px;
            position: relative;
            z-index: 2;
            transition: opacity 240ms ease;
        }

        #timer-display {
            min-width: 120px;
            text-align: center;
            color: rgba(255, 150, 48, 0.54);
            font-size: clamp(1.9rem, 5vw, 2.8rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            line-height: 1.05;
            transition: color 400ms ease;
        }

        #timer-display.running {
            color: rgba(255, 190, 72, 0.92);
        }

        #timer-display.ending {
            color: rgba(255, 238, 120, 1);
        }

        .dur-row,
        .main-row,
        .option-row,
        #custom-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dur-row button,
        .main-row button,
        .option-row button,
        #custom-row button {
            min-height: 34px;
            padding: 7px 13px;
            font-size: 0.64rem;
        }

        .main-row button {
            min-width: 112px;
            padding: 9px 18px;
        }

        #custom-row {
            display: none;
        }

        #custom-row.show {
            display: flex;
        }

        #custom-input {
            width: 148px;
            min-height: 34px;
            padding: 7px 10px;
            border: 1px solid rgba(255, 110, 0, 0.35);
            border-radius: 2px;
            background: rgba(255, 86, 0, 0.035);
            color: rgba(255, 218, 112, 0.92);
            caret-color: rgba(255, 218, 112, 0.92);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-align: center;
            outline: none;
        }

        #custom-input::placeholder {
            color: rgba(255, 165, 60, 0.34);
            font-family: "Cormorant Garamond", Georgia, serif;
            font-style: italic;
            letter-spacing: 0.02em;
        }

        #custom-input:focus {
            border-color: rgba(255, 160, 16, 0.72);
        }

        #instruction {
            max-width: 420px;
            margin: 0;
            color: rgba(255, 255, 255, 0.16);
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(0.74rem, 1.7vw, 0.88rem);
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.03em;
            line-height: 1.75;
            text-align: center;
        }

        body:fullscreen #app {
            padding-top: 12px;
        }

        body.minimal #flame-picker,
        body.minimal #controls {
            opacity: 0;
            pointer-events: none;
        }

        body.minimal #app {
            grid-template-rows: 0 minmax(0, 1fr) 0;
            padding: 0;
        }

        body.minimal #flame-svg {
            width: min(96vmin, 720px);
            height: min(104vmin, 860px);
        }

        body.minimal #flame-halo {
            width: min(110vmin, 860px);
            height: min(120vmin, 980px);
        }

        body:fullscreen.session-idle #flame-picker,
        body:fullscreen.session-idle #controls {
            opacity: 0.12;
        }

        #end-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: var(--end-bg);
            color: var(--end-fg);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 300ms ease, background 300ms ease, color 300ms ease;
        }

        #end-overlay.white {
            background: #fff;
            color: rgba(0, 0, 0, 0.78);
        }

        #end-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        #end-main {
            color: currentColor;
            opacity: 0;
            font-size: clamp(1.25rem, 3.2vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.22em;
            line-height: 1.35;
            text-align: center;
            text-transform: uppercase;
            transition: opacity 1100ms ease;
        }

        #end-main.show,
        #end-sub.show,
        #end-again.show {
            opacity: 1;
        }

        #end-sub {
            max-width: 390px;
            color: currentColor;
            opacity: 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(0.92rem, 2vw, 1.1rem);
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.05em;
            line-height: 1.85;
            text-align: center;
            transition: opacity 1500ms ease;
        }

        #end-again {
            margin-top: 18px;
            opacity: 0;
            padding: 10px 26px;
            transition: opacity 900ms ease, background 180ms ease, border-color 180ms ease, color 180ms ease;
        }

        #end-overlay.white #end-again {
            border-color: rgba(0, 0, 0, 0.24);
            color: rgba(0, 0, 0, 0.58);
        }

        #end-overlay.white .shortcut {
            color: rgba(0, 0, 0, 0.54);
        }

        body.minimal #end-main,
        body.minimal #end-sub,
        body.minimal #end-again {
            display: none;
        }

        @keyframes halo-pulse {
            0%, 100% { transform: scale(1); opacity: 0.82; }
            50% { transform: scale(1.07); opacity: 1; }
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 30px rgba(255, 68, 0, 0.78)) drop-shadow(0 0 80px rgba(255, 34, 0, 0.42));
            }
            50% {
                transform: scale(1.026);
                filter: drop-shadow(0 0 44px rgba(255, 102, 0, 0.88)) drop-shadow(0 0 112px rgba(255, 42, 0, 0.56));
            }
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) skewX(0deg); opacity: 1; }
            24% { transform: scale(1.014) skewX(0.55deg); opacity: 0.96; }
            48% { transform: scale(0.992) skewX(-0.4deg); opacity: 1; }
            72% { transform: scale(1.008) skewX(0.25deg); opacity: 0.97; }
        }

        @media (max-width: 680px) {
            #app {
                min-height: 460px;
                padding: 10px 10px 14px;
                gap: 7px;
            }

            .fpick {
                min-width: 60px;
                min-height: 68px;
                padding: 5px 7px 6px;
                font-size: 0.48rem;
            }

            .fpick svg {
                width: 27px;
                height: 38px;
            }

            .shortcut {
                font-size: 0.66rem;
            }

            .dur-row button,
            .main-row button,
            .option-row button,
            #custom-row button {
                min-height: 32px;
                padding: 6px 10px;
                font-size: 0.58rem;
            }
        }
    </style>
</head>
<body data-bg="black">
<div id="app">
    <div id="flame-picker" aria-label="Flame type">
        <button class="fpick active" data-flame="0">
            <svg data-thumb="0" viewBox="-90 -90 380 510"></svg>
            Classic
            <span class="shortcut">1</span>
        </button>
        <button class="fpick" data-flame="1">
            <svg data-thumb="1" viewBox="-90 -90 380 510"></svg>
            Candle
            <span class="shortcut">2</span>
        </button>
        <button class="fpick" data-flame="2">
            <svg data-thumb="2" viewBox="-90 -90 380 510"></svg>
            Solar
            <span class="shortcut">3</span>
        </button>
        <button class="fpick" data-flame="3">
            <svg data-thumb="3" viewBox="-90 -90 380 510"></svg>
            Bonfire
            <span class="shortcut">4</span>
        </button>
        <button class="fpick" data-flame="4">
            <svg data-thumb="4" viewBox="-90 -90 380 510"></svg>
            Ember
            <span class="shortcut">5</span>
        </button>
    </div>

    <main id="flame-wrap" aria-label="Meditation flame">
        <div id="flame-halo"></div>
        <svg id="flame-svg" viewBox="-90 -90 380 510" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    </main>

    <section id="controls" aria-label="Timer controls">
        <div id="timer-display">1:00</div>

        <div class="dur-row" aria-label="Duration">
            <button data-dur="30">30s<span class="shortcut">q</span></button>
            <button data-dur="60" class="active">60s<span class="shortcut">w</span></button>
            <button data-dur="90">90s<span class="shortcut">e</span></button>
            <button data-dur="120">2m<span class="shortcut">r</span></button>
            <button data-dur="180">3m<span class="shortcut">t</span></button>
            <button id="custom-btn" data-dur="custom">Custom<span class="shortcut">enter</span></button>
        </div>

        <div id="custom-row">
            <input id="custom-input" type="text" placeholder="2:30 or 45" maxlength="8" autocomplete="off" spellcheck="false" inputmode="numeric">
            <button id="custom-set">Set<span class="shortcut">enter</span></button>
        </div>

        <div class="main-row">
            <button id="play-btn">Begin<span class="shortcut">space</span></button>
            <button id="reset-btn">Reset<span class="shortcut">backspace</span></button>
            <button id="fullscreen-btn">Fullscreen<span class="shortcut">f / esc</span></button>
        </div>

        <div class="option-row">
            <button id="white-toggle" aria-pressed="false">White End<span class="shortcut">b</span></button>
            <button id="minimal-toggle" aria-pressed="false">Minimal<span class="shortcut">m</span></button>
            <button class="bg-btn active" data-bg="black">Black<span class="shortcut">z</span></button>
            <button class="bg-btn" data-bg="white">White<span class="shortcut">x</span></button>
            <button class="bg-btn" data-bg="red">Red<span class="shortcut">c</span></button>
            <button class="bg-btn" data-bg="gray">Gray<span class="shortcut">v</span></button>
        </div>

        <p id="instruction">
            Gaze softly at the white dot. Try not to blink or look away.<br>
            When the timer ends, close your eyes immediately.
        </p>
    </section>
</div>

<div id="end-overlay" aria-live="polite">
    <div id="end-main">Close your eyes now</div>
    <div id="end-sub">
        Observe the nimitta forming in the darkness.<br>
        Let it stabilise without grasping.
    </div>
    <button id="end-again">Sit Again<span class="shortcut">space</span></button>
</div>

    },
    {
        name: "Solar",

        dot: [100, 145],
        svg: `

const CURSOR_IDLE_MS = 900;

let duration = 60;
let remaining = 60;
let ticker = null;
let running = false;
let sessionStarted = false;
let currentFlame = 0;
let whiteEnd = false;
let minimalMode = false;
let cursorTimer = null;
let wakeLock = null;

const display = document.getElementById("timer-display");
const playBtn = document.getElementById("play-btn");
const resetBtn = document.getElementById("reset-btn");
const fullscreenBtn = document.getElementById("fullscreen-btn");
const whiteToggle = document.getElementById("white-toggle");
const minimalToggle = document.getElementById("minimal-toggle");
const endOverlay = document.getElementById("end-overlay");
const endMain = document.getElementById("end-main");
const endSub = document.getElementById("end-sub");
const endAgain = document.getElementById("end-again");
const flameSvg = document.getElementById("flame-svg");
const customBtn = document.getElementById("custom-btn");
const customRow = document.getElementById("custom-row");
const customInput = document.getElementById("custom-input");
const customSet = document.getElementById("custom-set");
const durationButtons = [...document.querySelectorAll(".dur-row button[data-dur]")];
const flameButtons = [...document.querySelectorAll(".fpick")];
const bgButtons = [...document.querySelectorAll(".bg-btn")];
const TIME_KEYS = ["q", "w", "e", "r", "t", "y"];
const BG_KEYS = { z: "black", x: "white", c: "red", v: "gray" };

function fmt(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${String(secs).padStart(2, "0")}`;
}

function refresh() {
    display.textContent = fmt(remaining);
    display.classList.toggle("running", running);
    display.classList.toggle("ending", running && remaining <= 5);
    playBtn.innerHTML = `${sessionStarted ? "Finish" : "Begin"}<span class="shortcut">space</span>`;
}

function loadFlame(index) {
    currentFlame = (index + FLAMES.length) % FLAMES.length;
    const flame = FLAMES[currentFlame];

    flameSvg.classList.add("switching");
    window.setTimeout(() => {
        flameSvg.setAttribute("viewBox", expandedViewBox(flame.viewBox));
        flameSvg.innerHTML = `${prefixedSvg(flame.svg, "main-flame")}
            <circle cx="${flame.dot[0]}" cy="${flame.dot[1]}" r="5.5" fill="#fff"
                style="filter:drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 15px rgba(255,255,255,0.66))"/>`;
        flameSvg.classList.remove("switching");
    }, 170);

    flameButtons.forEach((button, idx) => button.classList.toggle("active", idx === currentFlame));
}

function expandedViewBox(viewBox) {
    const [x, y, width, height] = viewBox.split(/\s+/).map(Number);
    const padX = 90;
    const padTop = 90;
    const padBottom = 130;
    return `${x - padX} ${y - padTop} ${width + padX * 2} ${height + padTop + padBottom}`;
}

function prefixedSvg(svg, prefix) {
    return svg
        .replace(/\bid="([^"]+)"/g, `id="${prefix}-$1"`)
        .replace(/url\(#([^)]+)\)/g, `url(#${prefix}-$1)`);
}

function renderFlamePickerThumbs() {
    document.querySelectorAll("[data-thumb]").forEach(svg => {
        const index = Number(svg.dataset.thumb);
        const flame = FLAMES[index];
        if (!flame) return;

        svg.setAttribute("viewBox", expandedViewBox(flame.viewBox));
        svg.innerHTML = prefixedSvg(flame.svg, `thumb-${index}`);
    });
}

function parseCustomTime(value) {
    const text = value.trim().toLowerCase();
    if (!text) return null;

    const colon = text.match(/^(\d{1,2}):([0-5]?\d)$/);
    if (colon) return Number(colon[1]) * 60 + Number(colon[2]);

    const units = text.match(/^(?:(\d+)\s*m(?:in(?:ute)?s?)?)?\s*(?:(\d+)\s*s(?:ec(?:ond)?s?)?)?$/);
    if (units && (units[1] || units[2])) {
        return (Number(units[1] || 0) * 60) + Number(units[2] || 0);
    }

    const number = text.match(/^(\d+)$/);
    return number ? Number(number[1]) : null;
}

function setDuration(seconds, activeButton = null) {
    if (!Number.isFinite(seconds) || seconds < 5 || seconds > 3600) return false;

    duration = seconds;
    remaining = seconds;
    stopTimer();
    sessionStarted = false;
    refresh();
    customInput.style.borderColor = "";
    durationButtons.forEach(button => button.classList.toggle("active", button === activeButton));
    return true;
}

function applyCustomTime() {
    const seconds = parseCustomTime(customInput.value);
    if (!setDuration(seconds, customBtn)) {
        customInput.style.borderColor = "rgba(255, 50, 0, 0.78)";
        return;
    }

    customRow.classList.remove("show");
    customBtn.textContent = fmt(duration);
    customBtn.appendChild(shortcutNode("enter"));
}

function shortcutNode(label) {
    const span = document.createElement("span");
    span.className = "shortcut";
    span.textContent = label;
    return span;
}

function startTimer() {
    if (running) return;
    sessionStarted = true;
    running = true;
    refresh();
    requestWakeLock();

    ticker = window.setInterval(() => {
        remaining -= 1;
        refresh();

        if (remaining <= 0) {
            stopTimer();
            sessionStarted = false;
            remaining = 0;
            refresh();
            triggerEnd();
        }
    }, 1000);
}

function stopTimer() {
    window.clearInterval(ticker);
    ticker = null;
    running = false;
    refresh();
}

function toggleTimer() {
    if (endOverlay.classList.contains("show")) {
        resetAll(true);
        return;
    }

    if (sessionStarted) {
        finishSession();
    } else {
        startTimer();
    }
}

function resetAll(autostart = false) {
    stopTimer();
    sessionStarted = false;
    remaining = duration;
    endOverlay.classList.remove("show", "white");
    endMain.classList.remove("show");
    endSub.classList.remove("show");
    endAgain.classList.remove("show");
    refresh();

    if (autostart) {
        window.setTimeout(startTimer, 250);
    }
}

function triggerEnd() {
    endOverlay.classList.toggle("white", whiteEnd || document.body.dataset.bg === "white");
    endOverlay.classList.add("show");
    window.setTimeout(() => endMain.classList.add("show"), 220);
    window.setTimeout(() => endSub.classList.add("show"), 2300);
    if (!minimalMode) {
        window.setTimeout(() => endAgain.classList.add("show"), 7000);
    }
}

function finishSession() {
    stopTimer();
    sessionStarted = false;
    remaining = 0;
    refresh();
    triggerEnd();
}

function selectDurationByOffset(offset) {
    const activeIndex = Math.max(0, durationButtons.findIndex(button => button.classList.contains("active")));
    const nextIndex = (activeIndex + offset + durationButtons.length) % durationButtons.length;
    const nextButton = durationButtons[nextIndex];

    if (nextButton.dataset.dur === "custom") {
        customRow.classList.add("show");
        customInput.focus();
        return;
    }

    customRow.classList.remove("show");
    setDuration(Number(nextButton.dataset.dur), nextButton);
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
}

function resetCursorIdle() {
    document.body.classList.remove("cursor-hidden", "session-idle");
    window.clearTimeout(cursorTimer);

    if (!document.fullscreenElement) return;

    cursorTimer = window.setTimeout(() => {
        document.body.classList.add("cursor-hidden", "session-idle");
    }, CURSOR_IDLE_MS);
}

function forceHideCursorInFullscreen() {
    if (!document.fullscreenElement) return;

    window.clearTimeout(cursorTimer);
    cursorTimer = window.setTimeout(() => {
        document.body.classList.add("cursor-hidden", "session-idle");
    }, 250);
}

function setMinimalMode(enabled) {
    minimalMode = enabled;
    document.body.classList.toggle("minimal", minimalMode);
    minimalToggle.classList.toggle("active", minimalMode);
    minimalToggle.setAttribute("aria-pressed", String(minimalMode));
    if (minimalMode) endAgain.classList.remove("show");
}

function setBackground(name) {
    document.body.dataset.bg = name;
    bgButtons.forEach(button => button.classList.toggle("active", button.dataset.bg === name));
    if (endOverlay.classList.contains("show")) {
        endOverlay.classList.toggle("white", whiteEnd || name === "white");
    }
}

async function requestWakeLock() {
    if (!("wakeLock" in navigator) || wakeLock) return;

    try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
            wakeLock = null;
        });
    } catch {
        wakeLock = null;
    }
}

flameButtons.forEach((button, index) => {
    button.addEventListener("click", () => loadFlame(index));
});

durationButtons.forEach(button => {
    button.addEventListener("click", () => {
        if (button.dataset.dur === "custom") {
            customRow.classList.toggle("show");
            customInput.focus();
            return;
        }

        customRow.classList.remove("show");
        setDuration(Number(button.dataset.dur), button);
    });
});

customSet.addEventListener("click", applyCustomTime);
customInput.addEventListener("keydown", event => {
    if (event.key === "Enter") applyCustomTime();
    if (event.key === "Escape") customRow.classList.remove("show");
});

playBtn.addEventListener("click", toggleTimer);
resetBtn.addEventListener("click", () => resetAll(false));
fullscreenBtn.addEventListener("click", toggleFullscreen);
whiteToggle.addEventListener("click", () => {
    whiteEnd = !whiteEnd;
    whiteToggle.classList.toggle("active", whiteEnd);
    whiteToggle.setAttribute("aria-pressed", String(whiteEnd));
    if (endOverlay.classList.contains("show")) {
        endOverlay.classList.toggle("white", whiteEnd || document.body.dataset.bg === "white");
    }
});
minimalToggle.addEventListener("click", () => setMinimalMode(!minimalMode));
bgButtons.forEach(button => {
    button.addEventListener("click", () => setBackground(button.dataset.bg));
});
endAgain.addEventListener("click", () => resetAll(true));

document.addEventListener("keydown", event => {
    const typing = event.target === customInput;

    if (typing && !["Enter", "Escape"].includes(event.key)) return;

    if (event.code === "Space") {
        event.preventDefault();
        toggleTimer();
        return;
    }

    const lowerKey = event.key.toLowerCase();
    if (/^[1-9]$/.test(event.key)) {
        const flameIndex = Number(event.key) - 1;
        if (flameIndex < FLAMES.length) {
            event.preventDefault();
            loadFlame(flameIndex);
        }
        return;
    }

    const durationIndex = TIME_KEYS.indexOf(lowerKey);
    if (durationIndex > -1 && durationIndex < durationButtons.length - 1) {
        event.preventDefault();
        const button = durationButtons[durationIndex];
        customRow.classList.remove("show");
        setDuration(Number(button.dataset.dur), button);
        return;
    }

    if (BG_KEYS[lowerKey]) {
        event.preventDefault();
        setBackground(BG_KEYS[lowerKey]);
        return;
    }

    switch (event.key) {
        case "Backspace":
            resetAll(false);
            break;
        case "f":
        case "F":
            toggleFullscreen();
            break;
        case "b":
        case "B":
            whiteToggle.click();
            break;
        case "m":
        case "M":
            setMinimalMode(!minimalMode);
            break;
        case "Escape":
            if (endOverlay.classList.contains("show")) resetAll(false);
            if (document.fullscreenElement) document.exitFullscreen?.();
            break;
    }
});

document.addEventListener("fullscreenchange", forceHideCursorInFullscreen);
document.addEventListener("mousemove", resetCursorIdle);
document.addEventListener("mousedown", resetCursorIdle);
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") requestWakeLock();
});

renderFlamePickerThumbs();
loadFlame(0);
refresh();
</script>
